name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Backend (tipos, pruebas unitarias y e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: transporte
          POSTGRES_PASSWORD: transporte
          POSTGRES_DB: transporte_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transporte"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @transporte/api lint
      - run: pnpm --filter @transporte/api test
      - run: pnpm --filter @transporte/api test:e2e
        env:
          TEST_DATABASE_URL: postgres://transporte:transporte@localhost:5432/transporte_test
      - run: pnpm --filter @transporte/api build
